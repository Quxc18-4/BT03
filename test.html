<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Dashboard - Ver 1</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        tr:nth-child(odd) {
            background-color: #ffffff;
            color: #000000;
        }
        tr:nth-child(even) {
            background-color: #000000;
            color: #ffffff;
        }
        .product-img {
            width: 100px;
            height: auto;
            object-fit: contain;
            display: block;
        }
        .controls { 
            margin-bottom: 20px; 
        }
        .pagination { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            justify-content: center; 
        }
        button { 
            padding: 5px 10px; 
            cursor: pointer; 
        }
        button:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
        }
    </style>
</head>
<body>
    <h1>Product Dashboard</h1>
    <div id="dashboard">
        <div class="controls" style="margin-bottom: 20px;">
            <input type="text" id="search-input" placeholder="Search by title..." style="padding: 5px; width: 300px;">
            <select id="items-per-page">
                <option value="5">5 items/page</option>
                <option value="10" selected>10 items/page</option>
                <option value="20">20 items/page</option>
            </select>
            <div style="margin-top: 10px;">
                <button onclick="handleSort('price', 'asc')">Giá tăng</button>
                <button onclick="handleSort('price', 'desc')">Giá giảm</button>
                <button onclick="handleSort('title', 'asc')">Tên A-Z</button>
                <button onclick="handleSort('title', 'desc')">Tên Z-A</button>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody id="product-table-body">
                </tbody>
        </table>
    </div>
    <div class="pagination">
        <button id="prev-btn" onclick="changePage(-1)">Previous</button>
        <span id="page-info">Page 1</span>
        <button id="next-btn" onclick="changePage(1)">Next</button>
    </div>
    <script src="main.js"></script>
</body>
</html>
